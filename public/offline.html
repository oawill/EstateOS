<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f7f7f7; color: #1a1a1a; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #666; font-size: 14px; }
      button { background: #1a1a1a; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Check your connection and try again. Nothing is shown here until you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
